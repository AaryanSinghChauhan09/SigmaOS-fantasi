<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Fantasi</title>
  <desc>A picture made from words: a photo print seen from the front, as Omaview's, in Tokyo Night colors, a pale border around a sky in the main color with two mountains, and two four-pointed sparkles in the highlight rising off its top corner, each piece with a hard shadow.</desc>
  <defs>
    <linearGradient id="main" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#8faef6"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <!-- The print, moved down and over to make room for the sparkles. -->
    <g transform="translate(52 128) scale(.92) translate(-76 -100)">
      <!-- The print; one hard shadow, as Omaview's. -->
      <rect x="76" y="100" width="360" height="312" rx="20" fill="#0e0e14" transform="translate(0 8.7)"/>
      <!-- The picture: sky, a far mountain and a near one. -->
      <rect x="100" y="124" width="312" height="264" rx="12" fill="url(#main)"/>
      <g stroke-width="16" stroke-linejoin="round">
        <path d="M190 400L312 244L420 372V400Z" fill="#565f89" stroke="#565f89"/>
        <path d="M92 400V344L184 262L300 400Z" fill="#1a1b26" stroke="#1a1b26"/>
      </g>
      <!-- The border, laid over the picture so it trims the mountains
           without a clip, which not every SVG renderer applies. -->
      <path d="M96 100H416A20 20 0 0 1 436 120V392A20 20 0 0 1 416 412H96A20 20 0 0 1 76 392V120A20 20 0 0 1 96 100Z M112 124A12 12 0 0 0 100 136V376A12 12 0 0 0 112 388H400A12 12 0 0 0 412 376V136A12 12 0 0 0 400 124Z" fill="#c0caf5" fill-rule="evenodd"/>
    </g>
    <!-- The sparkles: four points with curved sides, a large one on the
         print's corner and a small one beside it, raised off the page. -->
    <path d="M370 52Q378 112 434 120Q378 128 370 188Q362 128 306 120Q362 112 370 52Z" fill="#0e0e14" transform="translate(0 8)"/>
    <path d="M370 52Q378 112 434 120Q378 128 370 188Q362 128 306 120Q362 112 370 52Z" fill="#bb9af7"/>
    <path d="M286 56Q290 82 314 86Q290 90 286 116Q282 90 258 86Q282 82 286 56Z" fill="#0e0e14" transform="translate(0 6)"/>
    <path d="M286 56Q290 82 314 86Q290 90 286 116Q282 90 258 86Q282 82 286 56Z" fill="#bb9af7"/>
  </g>
</svg>
